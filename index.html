<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta
        name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
              />
                <meta name="theme-color" content="#f7f1eb" />

                  <title>For Kabita ♡</title>

                    <link rel="stylesheet" href="style.css" />
                    </head>

                    <body>

                      <!-- Floating atmosphere -->
                        <div class="ambient">
                            <span></span>
                                <span></span>
                                    <span></span>
                                        <span></span>
                                            <span></span>
                                              </div>

                                                <!-- OPENING -->
                                                  <main id="opening" class="screen active">

                                                      <div class="opening-content">

                                                            <p class="eyebrow">A LITTLE SOMETHING FOR YOU</p>

                                                                  <div class="name-wrap">
                                                                          <h1>Kabita</h1>
                                                                                  <div class="gold-line"></div>
                                                                                          <p class="surname">SHAH</p>
                                                                                                </div>

                                                                                                      <p class="opening-message">
                                                                                                              Made with love, patience...<br />
                                                                                                                      and a little bit of sibling mischief.
                                                                                                                            </p>

                                                                                                                                  <button id="enterBtn" class="primary-btn">
                                                                                                                                          <span>Enter the surprise</span>
                                                                                                                                                  <span class="arrow">→</span>
                                                                                                                                                        </button>

                                                                                                                                                              <p class="tiny-note">P.S. No skipping ahead. 😌</p>

                                                                                                                                                                  </div>

                                                                                                                                                                    </main>


                                                                                                                                                                      <!-- DISCOVERY -->
                                                                                                                                                                        <main id="discovery" class="screen">

                                                                                                                                                                            <div class="discovery-content">

                                                                                                                                                                                  <p class="eyebrow">A SMALL DISCOVERY</p>

                                                                                                                                                                                        <h2>There are three little<br />things hidden here.</h2>

                                                                                                                                                                                              <p class="discovery-intro">
                                                                                                                                                                                                      Take your time.<br />
                                                                                                                                                                                                              Tap around and see what you find.
                                                                                                                                                                                                                    </p>

                                                                                                                                                                                                                          <div class="discovery-grid">

                                                                                                                                                                                                                                  <button class="discovery-card" data-type="flower">
                                                                                                                                                                                                                                            <span class="card-icon">✿</span>
                                                                                                                                                                                                                                                      <span class="card-title">The Report</span>
                                                                                                                                                                                                                                                                <span class="card-hint">tap me</span>
                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                <button class="discovery-card" data-type="letter">
                                                                                                                                                                                                                                                                                          <span class="card-icon">♡</span>
                                                                                                                                                                                                                                                                                                    <span class="card-title">The Letter</span>
                                                                                                                                                                                                                                                                                                              <span class="card-hint">tap me</span>
                                                                                                                                                                                                                                                                                                                      </button>

                                                                                                                                                                                                                                                                                                                              <button class="discovery-card" data-type="gift">
                                                                                                                                                                                                                                                                                                                                        <span class="card-icon">◇</span>
                                                                                                                                                                                                                                                                                                                                                  <span class="card-title">The Mystery</span>
                                                                                                                                                                                                                                                                                                                                                            <span class="card-hint">tap me</span>
                                                                                                                                                                                                                                                                                                                                                                    </button>

                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                <p id="progressText" class="progress-text">
                                                                                                                                                                                                                                                                                                                                                                                        0 of 3 discovered
                                                                                                                                                                                                                                                                                                                                                                                              </p>

                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                    </main>


                                                                                                                                                                                                                                                                                                                                                                                                      <!-- POPUP -->
                                                                                                                                                                                                                                                                                                                                                                                                        <div id="modal" class="modal">

                                                                                                                                                                                                                                                                                                                                                                                                            <div class="modal-backdrop"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                <div class="modal-box">

                                                                                                                                                                                                                                                                                                                                                                                                                      <button id="closeModal" class="close-btn">×</button>

                                                                                                                                                                                                                                                                                                                                                                                                                            <p id="modalEyebrow" class="eyebrow"></p>

                                                                                                                                                                                                                                                                                                                                                                                                                                  <div id="modalIcon" class="modal-icon"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3 id="modalTitle"></h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <div id="modalText" class="modal-text"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button id="modalContinue" class="secondary-btn">
                                                                                                                                                                                                                                                                                                                                                                                                                                                            Close for now
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script src="script.js"></script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
